    <style>
        * {
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 3D Flip Card Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        .flip-card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.35s ease-out forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Confetti canvas */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* Chat simulation */
        .chat-bubble-anim {
            animation: chatSlide 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes chatSlide {
            from { opacity: 0; transform: translateY(12px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Deconstruction Puzzle styles */
        .puzzle-segment {
            display: inline;
            padding: 3px 6px;
            margin: 2px;
            border-radius: 6px;
            border-bottom: 2px dashed #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }
        .puzzle-segment:hover {
            background-color: rgba(59, 130, 246, 0.15);
            border-bottom-color: #3b82f6;
        }
        .puzzle-segment.active-correct {
            background-color: #dcfce7 !important;
            color: #166534 !important;
            border-bottom: 2px solid #22c55e !important;
            font-weight: 800;
        }
        .puzzle-segment.active-wrong {
            background-color: #fee2e2 !important;
            color: #991b1b !important;
            border-bottom: 2px solid #ef4444 !important;
            animation: shake 0.3s;
        }

        /* Cooldown Timer progress */
        .cooldown-fill-bar {
            transition: width 1s linear;
        }

        /* Printing optimizations */
        @media print {
            body { background: white !important; color: black !important; }
            #app-header, #stumble-btn, #print-controls-bar, button { display: none !important; }
            #certificate-container { border: 8px double #047857 !important; box-shadow: none !important; }
        }
    </style>

        // Pure Web Audio Synth (Zero external audio dependencies)
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playBeep(freq, type, duration, volume = 0.08) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(volume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                // Audio safely ignored if browser blocked
            }
        }

            tap: () => playBeep(450, 'sine', 0.08, 0.05),

            success: () => {
                playBeep(523, 'sine', 0.1, 0.08);
                setTimeout(() => playBeep(659, 'sine', 0.12, 0.08), 90);
                setTimeout(() => playBeep(783, 'sine', 0.25, 0.08), 180);

            victory: () => {

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6', '#14b8a6'];
            
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.8) * 16,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 8
                });
            }
            
            let frameCount = 0;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let stillActive = false;
                
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.4; // gravity
                    p.rotation += p.rotationSpeed;
                    
                    if (p.y < canvas.height + 20) stillActive = true;
                    
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });
                
                frameCount++;
                if (stillActive && frameCount < 180) {
                    requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            render();
        }

            meterEl.style.width = `${chatMeterValue}%`;
            if (chatMeterValue >= 70) meterEl.className = "h-full bg-emerald-500 rounded-full transition-all duration-500";

            // Simulated typing & reply
            setTimeout(() => {
                msgsBox.innerHTML += `
                    <div id="typing-bubble" class="chat-bubble-anim bg-slate-200 dark:bg-slate-700 p-2.5 rounded-2xl rounded-tr-none w-14 flex justify-center gap-1">

                        <span class="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce" style="animation-delay: 0.3s"></span>
                    </div>
                `;

                setTimeout(() => {
                    const typingEl = document.getElementById('typing-bubble');
                    if (typingEl) typingEl.remove();

                    msgsBox.innerHTML += `
                        <div class="chat-bubble-anim bg-white dark:bg-slate-800 p-3.5 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] self-start border-r-4 ${option.correct ? 'border-r-emerald-500 text-emerald-800 dark:text-emerald-300' : 'border-r-rose-500 text-rose-800 dark:text-rose-300'} text-right leading-relaxed font-bold">
                            ${option.botReply}
                        </div>
                    `;
                    msgsBox.scrollTop = msgsBox.scrollHeight;

                    // Outcome handling
                    const isSuccess = handleChallengeOutcome(option.correct, option.exp, challenge);
                    optionsBox.classList.add('hidden');

                    const outcomeBox = document.getElementById('chat-outcome-box');
                    outcomeBox.classList.remove('hidden');
                    outcomeBox.innerHTML = `
                        <div class="p-4 rounded-xl text-sm leading-relaxed mb-3 ${isSuccess ? 'bg-emerald-50 text-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800' : 'bg-rose-50 text-rose-800 dark:bg-rose-950/40 dark:text-rose-300 border border-rose-200 dark:border-rose-800'}">

        /* --- GAME 2: Sort Actions (Touch / Click Friendly) --- */
        function buildSortHTML(challenge) {
            return `
                <div id="sort-game" class="bg-white dark:bg-dark-card rounded-3xl p-5 sm:p-8 shadow-xl border border-slate-200 dark:border-slate-700">

                    <!-- Baskets -->
                    <div class="grid grid-cols-2 gap-3 mb-6">

                        </div>

                            <h4 class="font-black text-rose-800 dark:text-rose-400 text-sm">سلة التسرع</h4>
                            <div id="items-in-haste" class="mt-2 space-y-1.5"></div>

                    <!-- Feedback -->
                    <div id="sort-result-box" class="hidden"></div>
                </div>
            `;
        }

        function initSortState(challenge) {
            activeSortItems = shuffleList(challenge.items);
            sortedBaskets = { wisdom: [], haste: [] };
            
            const pool = document.getElementById('sort-items-pool');
            pool.innerHTML = activeSortItems.map(item => `
                <div id="sort-item-${item.id}" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-3 transition shadow-sm">
                    <span class="font-bold text-xs sm:text-sm text-slate-800 dark:text-white text-center sm:text-right">${item.text}</span>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="placeSortItem(${item.id}, 'wisdom')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold transition shadow-sm">
                            حكمة 🕊️
                        </button>
                        <button onclick="placeSortItem(${item.id}, 'haste')" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold transition shadow-sm">
                            تسرع 🔥
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function placeSortItem(itemId, choice) {
            Sound.itemDrop();
            const domItem = document.getElementById(`sort-item-${itemId}`);
            const itemData = activeSortItems.find(i => i.id === itemId);
            if (!domItem || !itemData) return;

            itemData.chosen = choice;
            sortedBaskets[choice].push(itemData);

            // Move to basket
            domItem.remove();
            const targetContainer = document.getElementById(`items-in-${choice}`);
            targetContainer.innerHTML += `
                <div class="text-xs bg-white dark:bg-slate-800 p-2 rounded-lg shadow-sm font-semibold border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200">
                    ${itemData.text}
                </div>
            `;

            // Check if all are sorted
            if ((sortedBaskets.wisdom.length + sortedBaskets.haste.length) === activeSortItems.length) {
                finalizeSortGame();
            }
        }

        function finalizeSortGame() {
            const challenge = appData[currentLevelIdx].challenges[currentChallengeIdx];
            let allAccurate = true;

            activeSortItems.forEach(item => {
                if (item.target !== item.chosen) {
                    allAccurate = false;
                }
            });

            const isSuccess = handleChallengeOutcome(allAccurate, "التصنيف الصحيح يتطلب التمييز الدقيق بين الرفق والحكمة وبين التسرع والانفعال.", challenge);
            const box = document.getElementById('sort-result-box');
            box.classList.remove('hidden');
            box.innerHTML = `
                <div class="p-4 rounded-xl text-sm leading-relaxed mb-4 ${isSuccess ? 'bg-emerald-50 text-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-300 border border-emerald-300' : 'bg-rose-50 text-rose-800 dark:bg-rose-950/40 dark:text-rose-300 border border-rose-300'}">

                    <p class="font-medium">${isSuccess ? 'أثبتّ وعياً عالياً بمسارات النصيحة الحكيمة ومزالق التسرع.' : 'تأمل القواعد جيداً وتذكر أن النصح في السر والرحمة يسبقان أي مواجهة.'}</p>

        /* --- GAME 3: Deconstruct the Doubt Puzzle --- */
        function buildPuzzleHTML(challenge) {
            return `
                <div id="puzzle-app" class="bg-white dark:bg-dark-card rounded-3xl p-5 sm:p-8 shadow-xl border border-slate-200 dark:border-slate-700">
                    <div class="flex justify-between items-center mb-3">

                    </div>

                    <h3 class="text-lg font-black text-slate-800 dark:text-white mb-2">${challenge.title}</h3>
                    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mb-6 leading-relaxed bg-amber-50/60 dark:bg-slate-800 p-3 rounded-xl border border-amber-100 dark:border-slate-700">

        function clickPuzzleSegment(partStr, spanEl) {
            if (spanEl.classList.contains('active-correct') || spanEl.classList.contains('active-wrong')) return;
            
            const part = JSON.parse(decodeURIComponent(partStr));
            const challenge = appData[currentLevelIdx].challenges[currentChallengeIdx];
            const box = document.getElementById('puzzle-result-box');

            if (part.isCore) {
                spanEl.classList.add('active-correct');
                const isSuccess = handleChallengeOutcome(true, part.exp, challenge);
                
                // Disable all segments
                document.querySelectorAll('.puzzle-segment').forEach(s => s.style.pointerEvents = 'none');

                box.classList.remove('hidden');
                box.innerHTML = `
                    <div class="p-4 rounded-xl text-sm leading-relaxed mb-4 bg-emerald-50 text-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-300 border border-emerald-300">

                container.classList.add('animate-shake');
                setTimeout(() => container.classList.remove('animate-shake'), 400);

        function buildCooldownHTML(challenge) {

            return `

        function triggerCooldownTimer(seconds) {
            Sound.tap();
            const btn = document.getElementById('cd-trigger-btn');
            const overlay = document.getElementById('cd-progress-overlay');
            if (!btn || !overlay) return;

            btn.style.pointerEvents = 'none';
            btn.querySelector('span').innerHTML = `<span>جاري كظم الغيظ والاستغفار...</span> <span>🕊️</span>`;

                Sound.success();
                document.getElementById('cd-timer-section').classList.add('hidden');
                const optSection = document.getElementById('cd-options-section');
                optSection.classList.remove('hidden');

                                <p class="font-bold text-slate-800 font-serif">منصة رحلة الحكمة</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateCertDisplay(val) {
            const display = document.getElementById('cert-name-label');
            if (display) {
                display.innerText = val.trim() === '' ? '[اسم المتدرب]' : val.trim();
            }
        }
        /* ==========================================================================
           8. APPLICATION BOOTSTRAP
           ========================================================================== */
        window.addEventListener('DOMContentLoaded', () => {
            renderWelcome();
        });
    </script>
</body>
